<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>온볼 iOS 런치 이미지 마스터</title>
<!--
  iOS 런치 스크린(apple-touch-startup-image) 마스터를 굽기 위한 정적 페이지.

  iOS 는 코드 애니메이션을 쓸 수 없고 정지 PNG 만 받는다. 그래서 AppSplash 의
  '착지 완료' 상태를 그대로 한 장으로 굽는다 — 그래야 OS 런치 이미지에서
  앱 스플래시로 넘어갈 때 그림이 튀지 않는다.
  (iOS 설치형에서는 layout.tsx 가 <html>.splash-static 을 달아 바운스를 생략시킨다)

  굽는 법 — 새 의존성 없이 크롬 헤드리스로:

    chrome --headless=new --disable-gpu --hide-scrollbars \
           --force-device-scale-factor=3 --window-size=430,932 \
           --screenshot=public/splash/apple-splash.png \
           --virtual-time-budget=3000 \
           scripts/splash-master.html

  → 1290 × 2796 (iPhone 15/16 Pro Max, @3x). 이 한 장이 layout.tsx 의
    SPLASH_DEVICES 모든 해상도에 매핑되고 기기별 차이는 iOS 가 스케일한다.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Noto+Sans+KR:wght@400&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #191714; overflow: hidden; }
  .stage {
    position: fixed; inset: 0; background: #191714;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  /* globals.css 의 .splash-* 와 동일한 수치 (로고 540×150 좌표계) */
  .lock { --lw: min(70vw, 380px); --u: calc(var(--lw) / 540); display: flex; align-items: flex-end; }
  .ball { width: calc(var(--u) * 152); height: auto; flex: none; margin-bottom: calc(var(--u) * -6); }
  .col  { display: flex; flex-direction: column; align-items: stretch; }
  .word {
    font-family: 'Barlow Condensed', 'Oswald', 'Arial Narrow', sans-serif;
    font-weight: 700; font-size: calc(var(--u) * 96); line-height: 1;
    letter-spacing: .012em; color: #fff; white-space: nowrap;
    margin-bottom: calc(var(--u) * -6);
  }
  .rule { height: calc(var(--u) * 8); margin-left: calc(var(--u) * -46); background: #EAB308; border-radius: 99px; }
  .tag {
    position: absolute; left: 0; right: 0; bottom: 9%; margin: 0; text-align: center;
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    font-size: clamp(12px, 3.4vw, 15px); color: #A9A294; letter-spacing: .01em;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="lock">
      <svg class="ball" viewBox="0 0 152 132" aria-hidden="true">
        <g fill="none" stroke="#EAB308" stroke-width="8" stroke-linecap="round">
          <circle cx="76" cy="66" r="52"/>
          <path d="M25 66 H127"/>
          <path d="M76 14 V118"/>
          <path d="M41 25 C 60 45, 60 87, 41 107"/>
          <path d="M111 25 C 92 45, 92 87, 111 107"/>
        </g>
      </svg>
      <div class="col">
        <span class="word">ONBALL</span>
        <i class="rule"></i>
      </div>
    </div>
    <p class="tag">공이 온 순간은, 사라지지 않는다</p>
  </div>
</body>
</html>
