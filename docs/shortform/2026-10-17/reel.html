    const u = parallaxEase(camera.ease)((t - keys[i].t) / (keys[i + 1].t - keys[i].t));
    return parallaxMixPose(parallaxKeyPose(keys[i]), parallaxKeyPose(keys[i + 1]), u);
  }

  // parallaxPose(cam, depth, w, h) -> {tx, ty, zoom, rot}: where the frame centre lands for a layer
  // at `depth` (tx, ty in px), the layer's zoom about it and its rotation in radians.
  function parallaxPose(cam, depth, w, h) {
    const k = 1 / Math.max(depth, 1);
    return {
      tx: w / 2 - cam.x * k,
      ty: h / 2 - cam.y * k,
      zoom: 1 + (cam.zoom - 1) * k,
      rot: ((cam.rot * k) * Math.PI) / 180,
    };
  }

  function parallaxCheckLayer(layer, i) {
    const at = "parallax layers[" + i + "]";
    if (!layer || !(layer.image || typeof layer.draw === "function")) throw new Error(at + ": needs image or draw(ctx, w, h)");
    if (!(layer.depth >= 1) || !isFinite(layer.depth)) throw new Error(at + ": depth must be a number >= 1 (1 = nearest)");
  }

  // Layers back to front (deepest first); equal depths keep their array order.
  function parallaxOrdered(spec) {
    const layers = (spec && spec.layers) || [];
    layers.forEach(parallaxCheckLayer);
    return layers
      .map(function (layer, index) {
        return { layer: layer, index: index };
      })
      .sort(function (a, b) {
        return b.layer.depth - a.layer.depth || a.index - b.index;
      });
  }

  function parallaxSize(ctx, spec) {
    const w = spec.width || (ctx.canvas && ctx.canvas.width);
    const h = spec.height || (ctx.canvas && ctx.canvas.height);
    if (!(w > 0) || !(h > 0)) throw new Error("parallax: spec.width and spec.height are needed when ctx.canvas has no size");
    return { w: w, h: h };
  }

  // The layer's rest rectangle in frame px, before the camera: an image is cover-fitted to the frame
  // (fit "natural" keeps its own size), a draw layer is w x h (default the frame), then scaled about
  // the frame centre by layer.scale and spec.overscan and shifted by x, y.
  function parallaxRect(layer, overscan, w, h) {
    const src = layer.image;
    const iw = src ? src.naturalWidth || src.width : layer.w || w;
    const ih = src ? src.naturalHeight || src.height : layer.h || h;
    const fit = src && layer.fit !== "natural" ? Math.max(w / iw, h / ih) : 1;
    const s = fit * (layer.scale > 0 ? layer.scale : 1) * overscan;
    const rw = iw * s;
    const rh = ih * s;
    return { x: w / 2 + (layer.x || 0) - rw / 2, y: h / 2 + (layer.y || 0) - rh / 2, w: rw, h: rh };
  }

  function parallaxBlurPx(layer, spec) {
    if (layer.blur != null) return Math.max(0, layer.blur);
    const focus = spec.focusDepth == null ? 1 : spec.focusDepth;
    return Math.max(0, (spec.depthBlur || 0) * Math.abs(layer.depth - focus));
  }

  function drawParallaxLayer(ctx, layer, cam, spec, size) {
    const pose = parallaxPose(cam, layer.depth, size.w, size.h);
    const r = parallaxRect(layer, spec.overscan || 1, size.w, size.h);
    const blur = parallaxBlurPx(layer, spec);
    ctx.save();
    ctx.translate(pose.tx, pose.ty);
    if (pose.rot) ctx.rotate(pose.rot);
    ctx.scale(pose.zoom, pose.zoom);
    ctx.translate(-size.w / 2, -size.h / 2);
    if (layer.opacity != null) ctx.globalAlpha = layer.opacity;
    if (blur > 0) ctx.filter = "blur(" + blur + "px)";
    if (layer.image) {
      ctx.drawImage(layer.image, r.x, r.y, r.w, r.h);
    } else {
      ctx.translate(r.x, r.y);
      layer.draw(ctx, r.w, r.h);
    }
    ctx.restore();
  }

  // parallax(ctx, t, spec) — draws the layers back to front under the camera at time t.
  //   spec.layers[]  {image | draw(ctx, w, h), depth >= 1, x, y, scale, opacity, blur, fit, cover}
  //   spec.camera    {keys: [{t, x, y, zoom, rot}], ease: "inOut" | "linear" | "out" | fn}
  //   spec.focusDepth, spec.depthBlur   blur px per unit of depth from the focus (default focus 1)
  //   spec.overscan  extra scale on every layer; spec.width / spec.height when ctx.canvas has no size
  function parallax(ctx, t, spec) {
    const size = parallaxSize(ctx, spec);
    const cam = parallaxCamera(spec.camera, t);
    parallaxOrdered(spec).forEach(function (o) {
      drawParallaxLayer(ctx, o.layer, cam, spec, size);
    });
  }

  function parallaxSampleTimes(keys, step) {
    const t0 = keys[0].t;
    const t1 = keys[keys.length - 1].t;
    const times = [];
    for (let t = t0; t < t1; t += step) times.push(t);
    times.push(t1);
    return times;
  }

  // The frame's four corners mapped back into the layer's rest space under the layer's pose.
  function parallaxFrameInLayer(pose, w, h) {
    const cos = Math.cos(-pose.rot);
    const sin = Math.sin(-pose.rot);
    return [
      [0, 0],
      [w, 0],
      [w, h],
      [0, h],
    ].map(function (c) {
      const dx = c[0] - pose.tx;
      const dy = c[1] - pose.ty;
      return { x: (dx * cos - dy * sin) / pose.zoom + w / 2, y: (dx * sin + dy * cos) / pose.zoom + h / 2 };
    });
  }

  // The factor the layer's rect must grow by (about its centre) to hold the frame at one instant.
  function parallaxNeedAt(layer, spec, cam, size) {
    const pose = parallaxPose(cam, layer.depth, size.w, size.h);
    const r = parallaxRect(layer, spec.overscan || 1, size.w, size.h);
    const margin = parallaxBlurPx(layer, spec);
    let need = 0;
    parallaxFrameInLayer(pose, size.w, size.h).forEach(function (p) {
      need = Math.max(need, (2 * (Math.abs(p.x - (r.x + r.w / 2)) + margin)) / r.w, (2 * (Math.abs(p.y - (r.y + r.h / 2)) + margin)) / r.h);
    });
    return need;
  }

  function parallaxSpans(times, step) {
    const spans = [];
    times.forEach(function (t) {
      const open = spans[spans.length - 1];
      if (open && t - open.to <= step * 1.5) open.to = t;
      else spans.push({ from: t, to: t });
    });
    return spans;
  }

  function parallaxLayerCoverage(o, spec, times, size, step) {
    const failing = [];
    let need = 1;
    times.forEach(function (t) {
      const n = parallaxNeedAt(o.layer, spec, parallaxCamera(spec.camera, t), size);
      if (n > 1 + 1e-9) failing.push(t);
      need = Math.max(need, n);
    });
    if (!failing.length) return null;
    return { layer: o.index, depth: o.layer.depth, overscan: Math.ceil(need * 1000) / 1000, spans: parallaxSpans(failing, step) };
  }

  // parallaxCoverage(spec, w, h, {step}) -> {ok, width, height, step, layers: [{layer, depth, overscan, spans}]}
  // Walks the camera path every `step` s (default one 30 fps frame) and lists each layer whose rect
  // leaves a frame edge bare, the spans in s where it does, and `overscan`: the factor to multiply that
  // layer's scale by so the edge stays covered. A layer with cover: false is skipped. Blur is counted
  // as lost margin. Only rect geometry is checked, not whether the pixels in it are opaque.
  function parallaxCoverage(spec, w, h, opts) {
    const step = (opts && opts.step) || 1 / 30;
    const size = { w: w, h: h };
    const times = parallaxSampleTimes(parallaxSortedKeys(spec.camera), step);
    const layers = parallaxOrdered(spec)
      .filter(function (o) {
        return o.layer.cover !== false;
      })
      .map(function (o) {
        return parallaxLayerCoverage(o, spec, times, size, step);
      })
      .filter(Boolean);
    return { ok: layers.length === 0, width: w, height: h, step: step, layers: layers };
  }

  // ---- layers from one still ----

  function parallaxCanvas(w, h, make) {
    if (make) return make(w, h);
    if (typeof OffscreenCanvas !== "undefined") return new OffscreenCanvas(w, h);
    const c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    return c;
  }

  function parallaxTrace(ctx, path) {
    ctx.beginPath();
    if (typeof path === "function") return path(ctx);
    path.forEach(function (p, i) {
      const x = Array.isArray(p) ? p[0] : p.x;
      const y = Array.isArray(p) ? p[1] : p.y;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.closePath();
  }

  // A white mask of the path, grown by `grow` px and softened by `feather` px of blur.
  function parallaxMask(path, w, h, o) {
    const mask = parallaxCanvas(w, h, o.makeCanvas);
    const mctx = mask.getContext("2d");
    if (o.feather > 0) mctx.filter = "blur(" + o.feather + "px)";
    mctx.fillStyle = "#fff";
    parallaxTrace(mctx, path);
    mctx.fill();
    if (o.grow > 0) {
      mctx.strokeStyle = "#fff";
      mctx.lineWidth = o.grow * 2;
      mctx.lineJoin = "round";
      mctx.stroke();
    }
    return mask;
  }

  function parallaxSourceSize(image, o) {
    return { w: o.width || image.naturalWidth || image.width, h: o.height || image.naturalHeight || image.height };
  }

  // cutLayer(image, path, {feather, width, height, makeCanvas}) -> canvas the size of the image with
  // only the pixels inside `path` ([{x,y}] or [[x,y]] points, or fn(ctx) that adds a path), the rest
  // transparent. `feather` px of blur softens the edge, so a moving cut-out does not show a hard
  // outline. Hold the result as an ImageBitmap before drawing it each frame (createImageBitmap).
  function cutLayer(image, path, opts) {
    const o = opts || {};
    const size = parallaxSourceSize(image, o);
    if (o.mask) parallaxAligned(o.mask, size, "cutLayer mask");
    const out = parallaxCanvas(size.w, size.h, o.makeCanvas);
    const octx = out.getContext("2d");
    octx.drawImage(image, 0, 0, size.w, size.h);
    octx.globalCompositeOperation = "destination-in";
    if (o.mask && o.feather > 0) octx.filter = "blur(" + o.feather + "px)";
    octx.drawImage(o.mask || parallaxMask(path, size.w, size.h, { feather: o.feather, makeCanvas: o.makeCanvas }), 0, 0);
    return out;
  }

  function parallaxAligned(image, size, label) {
    const actual = parallaxSourceSize(image, {});
    if (actual.w !== size.w || actual.h !== size.h) throw new Error(label + ": dimensions must match the source");
  }

  // mixKeyPhoto draws an aligned base and a prepared alpha-masked key patch.
  // Precompute the patch with cutLayer; no image decoding or canvas allocation occurs here.
  function mixKeyPhoto(ctx, base, keyPatch, amount, opts) {
    if (!Number.isFinite(amount) || amount < 0 || amount > 1) throw new Error("mixKeyPhoto: amount must be 0 to 1");
    const o = opts || {};
    const source = parallaxSourceSize(base, {});
    parallaxAligned(keyPatch, source, "mixKeyPhoto key patch");
    const size = parallaxSourceSize(base, o);
    const opacity = ctx.globalAlpha == null ? 1 : ctx.globalAlpha;
    ctx.save();
    ctx.drawImage(base, 0, 0, size.w, size.h);
    if (amount > 0) {
      ctx.globalAlpha = opacity * amount;
      ctx.drawImage(keyPatch, 0, 0, size.w, size.h);
    }
    ctx.restore();
  }

  // depthLayers partitions a same-size grayscale map once. White is near by default.
  // The caller supplies a repaired far plate; these transparent bands do not fill holes.
  function depthLayers(image, depthMap, opts) {
    const o = opts || {};

// same cue list renders identical audio on every run (design.md's

  // ---------------------------------------------------------------------

    let h = 0x811c9dc5;

    for (let i = 0; i < s.length; i++) {

      h = Math.imul(h, 0x01000193);
    }

  // per-film character (every film's kit sounded the same — the first film
  // was a basketball promo, and every later film's sounds carried that same
  // character; measured across 34 reels: pop in 13, thud in 6, whoosh/tick/
  // ding in 5 each — because every kind's default seed was the literal kind
  // name. references/sound.md "Kit").
  // setFilmKey(key), called once at page load, gives each kind's *default*
  // seed a film-specific prefix and derives small deterministic offsets
  // (pitch, decay, brightness/filter) per kind from that same key, so the
  // same kind still sounds like itself but differs film to film. An
  // explicit `seed` (or, for pop/ding, an explicit `freq`) from the caller
  // is never touched: default-only, same film -> identical samples, same
  // key across renders (seek is still a pure function of t).
  // ---------------------------------------------------------------------

  function setFilmKey(key) {

  }

  }

  // brightness/filter each +-30%. No film key set (filmKey === "") ->
  // identity, so behavior is unchanged for every existing render.
  function filmCharacter(kind) {
    if (!filmKey) return IDENTITY_CHARACTER;
    var rng = rngFor(filmKey + ":char:" + kind);

      decayMul: 1 + (rng() * 2 - 1) * 0.3,

  }

  // brightness (+-25%) from the seed alone, so two seeds sound like two different hits and one seed
  // always sounds the same. An explicit `freq` keeps its pitch exact; the seed then varies the timbre.
  function seedCharacter(seed) {
    var rng = rngFor("seed-char:" + seed);
    return {
      pitchSemi: (rng() * 2 - 1) * 3,

  // buffer utilities
  // ---------------------------------------------------------------------

  // Linear-ramp the first `rampMs` of `buf` from 0 -> its own value, in

  // "Material is the timbre" — exciter -> resonator -> body). `outLenSec` is
  // the tail length rendered past the exciter.
  function resonate(exciter, freqHz, tauSec, sampleRate, outLenSec) {
    const outN = Math.max(exciter.length, Math.round(outLenSec * sampleRate));

  // ---------------------------------------------------------------------

    const o = opts || {};

      for (let p = 0; p < ratios.length; p++) {

  }

  function sfxDing(sampleRate, opts) {
    const o = opts || {};

    const tau = 1.2 * character.decayMul;

  // sfxPluck(freq, vel, sampleRate), is still accepted for backward

  function sfxPluck(a, b, c) {

    const vel = o.vel == null ? 1 : o.vel;

  }

  // mix — the sample buffer a whole reel's sfx + bed are written into
  // ---------------------------------------------------------------------

    const L = new Float32Array(n);
    const R = new Float32Array(n);

    function add(buffer, atSec, gain, pan) {
      const g = gain == null ? 1 : gain;
      const p = pan == null ? 0 : pan; // -1 (left) .. 1 (right), equal-power
      const angle = ((p + 1) * Math.PI) / 4;
      const gL = Math.cos(angle);
      const gR = Math.sin(angle);
      const start = Math.round((atSec || 0) * sampleRate);
      for (let i = 0; i < buffer.length; i++) {
        const idx = start + i;
        if (idx < 0 || idx >= n) continue;
        L[idx] += buffer[i] * g * gL;
        R[idx] += buffer[i] * g * gR;
      }
    }

    // addStereo(stereoBuf, atSec, gain) — mixes a {L,R} buffer (e.g. a
    // musicBed) in directly, no panning (the bed is already centred).
    function addStereo(stereoBuf, atSec, gain) {
      const g = gain == null ? 1 : gain;
      const start = Math.round((atSec || 0) * sampleRate);
      const len = Math.min(stereoBuf.L.length, stereoBuf.R.length);
      for (let i = 0; i < len; i++) {
        const idx = start + i;
        if (idx < 0 || idx >= n) continue;
        L[idx] += stereoBuf.L[i] * g;
        R[idx] += stereoBuf.R[i] * g;
      }
    }

  }

  // musicBed — quiet music-box bed, no sustained tones (music-recipe.md)
  // ---------------------------------------------------------------------

  const KEY_OFFSETS = { C: 0, G: 7, D: 2 };

  const PENTATONIC_DEGREES = [0, 1, 2, 4, 5]; // scale indices for 1 2 3 5 6
  const CHORD_DEGREES = [0, 3, 4, 0]; // I IV V I, one per bar of a 4-bar phrase
  const ARP_OFFSETS = [0, 7, 4, 7]; // 1-5-3-5, semitones from the chord root

        const semis = chordRoot + ARP_OFFSETS[k % 4];
        const vel = k % 3 === 0 ? 1.0 : 0.7; // strong beats vs the rest
        const buf = pluckBuf(noteFreq(semis), vel, sampleRate, {});
        m.add(buf, t, bedGain * 0.55, 0);
      }

      for (let beat = 0; beat < 4; beat++) {
        const t = barStart + beat * beatSec;
        const idxInPhrase = phraseBar * 4 + beat; // 0..15 across the 4-bar phrase
        let degIdx;
        if (idxInPhrase === 7) degIdx = 3; // question ends on the 5th (over V)
        else if (idxInPhrase === 15) degIdx = 0; // answer resolves on the root (over I)
        else {
          const rng = rngFor("sva-bed-melody:" + bar + ":" + beat);
          degIdx = PENTATONIC_DEGREES[Math.floor(rng() * PENTATONIC_DEGREES.length)];
        }
        const semis = MAJOR_SCALE[degIdx] + keyOffset + 12;
        const buf = pluckBuf(noteFreq(semis), 0.8, sampleRate, {});
        m.add(buf, t, bedGain * 0.75, 0);
      }
    }

    return m;
  }

  // ---------------------------------------------------------------------
  // master + duck
  // ---------------------------------------------------------------------

  // master(mixObj, {peakDb=-3, refPeak=0.35}) — tanh soft-clip with a FIXED drive of 1 / refPeak, then
  // one fixed gain: a sample whose pre-master level is `refPeak` comes out at `peakDb`, a louder one is
  // soft-clipped (at most 2.4 dB above `peakDb`), a quieter one stays proportionally lower. The drive does
  // not depend on the mix, so adding or removing a hit never changes the level of any other hit. 0.35 is a music-box bed's own peak. Set `refPeak` to the pre-master peak of the
  // mix you want mastered to `peakDb` (measure it once), and keep it when the cue list changes.
  // Mutates and returns mixObj.L/R.
  const DEFAULT_MASTER_REF_PEAK = 0.35;
  function master(mixObj, opts) {
    const o = opts || {};
    const peakDb = o.peakDb == null ? -3 : o.peakDb;
    const refPeak = o.refPeak == null ? DEFAULT_MASTER_REF_PEAK : o.refPeak;
    if (!(refPeak > 0)) throw new Error("ReelAudio.master: refPeak must be a number > 0");
    const drive = 1 / refPeak;
    const finalGain = Math.pow(10, peakDb / 20) / Math.tanh(1);
    for (const c of [mixObj.L, mixObj.R]) {
      for (let i = 0; i < c.length; i++) c[i] = Math.tanh(c[i] * drive) * finalGain;
    }
    return mixObj;
  }

  // duck(bed, narrationWindows, {depthDb=-10, rampMs=120}) — lowers `bed`'s
  // L/R in place under each {start,end} window (narration seconds), with a
  // linear ramp in/out so the gain change is inaudible as a jump. Mutates
  // and returns `bed`.
  function duck(bed, narrationWindows, opts) {
    const o = opts || {};
    const depthDb = o.depthDb == null ? -10 : o.depthDb;
    const rampMs = o.rampMs == null ? 120 : o.rampMs;
    const sampleRate = bed.sampleRate;
    const duckGain = Math.pow(10, depthDb / 20);
    const rampN = Math.max(1, Math.round((rampMs / 1000) * sampleRate));
    const n = bed.L.length;
    const gainCurve = new Float32Array(n).fill(1);

    for (const win of narrationWindows || []) {
      const s = Math.max(0, Math.round(win.start * sampleRate));
      const e = Math.min(n, Math.round(win.end * sampleRate));
      for (let i = s; i < e; i++) gainCurve[i] = Math.min(gainCurve[i], duckGain);
      for (let i = 1; i <= rampN; i++) {
        const idx = s - i;
        if (idx < 0) break;
        const u = 1 - i / rampN;
        gainCurve[idx] = Math.min(gainCurve[idx], 1 + (duckGain - 1) * u);
      }
      for (let i = 0; i < rampN; i++) {
        const idx = e + i;
        if (idx >= n) break;
        const u = i / rampN;
        gainCurve[idx] = Math.min(gainCurve[idx], duckGain + (1 - duckGain) * u);
      }
    }

    for (let i = 0; i < n; i++) {
      bed.L[i] *= gainCurve[i];
      bed.R[i] *= gainCurve[i];
    }
    return bed;
  }

  // ---------------------------------------------------------------------
  // sfxPool — several sounds per effect kind, so a kind that returns many times does not repeat
  // ---------------------------------------------------------------------

  function peakOf(buf) {
    let p = 0;
    for (let i = 0; i < buf.length; i++) p = Math.max(p, Math.abs(buf[i]));
    return p;
  }

  // `src` played at `rate` (above 1 = higher and shorter), linear interpolation.
  function resample(src, rate) {
    if (rate === 1) return src;
    const n = Math.max(1, Math.floor(src.length / rate));
    const out = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = i * rate;
      const j = Math.floor(x);
      const f = x - j;
      out[i] = (src[j] || 0) * (1 - f) + (src[j + 1] || 0) * f;
    }
    return out;
  }

  const variantId = (kind, i, v) => (v.file ? v.file : kind + "-" + i);

  // sfxPool(pools, {seed}) -> {assign(cues), buffer(cue, sampleRate, files)}
  // `pools` maps an effect kind to its variants: {gen, seed?, rate?} (the kit synth `gen`, run with `seed`,
  // default the variant's id such as "pop-2", and played at pitch `rate`, 1 = as made) or {file, like} (a library file, levelled to the peak of the
  // kit's own `like` effect so it sits with the rest of the kind). Both kinds mix in one pool.
  //   assign(cues)  cues = [{kind, at, ...}] in any order. In time order each cue of a pooled kind gets
  //                 `variant` (the pool index) and `sound` (an id): the least-used variant of its kind that
  //                 is not the one just before it of that kind, and, among equals, not the one before that;
  //                 ties go round-robin from a start index derived from `seed` and the kind (same seed,
  //                 same assignment). A kind without a pool is left alone. A cue with
  //                 `pin: {variant, holds, holdsKind?}` takes pool variant `variant` of its own kind and
  //                 takes the place of variant `holds` of `holdsKind` (default its own kind) in the
  //                 rotation, so every other cue keeps the sound it had before the cue was changed.
  //   buffer(cue, sampleRate, files)  the cue's samples (cached per sound and rate); `files` maps a
  //                 variant's file name to {rate, data: Float32Array} the page loaded. null when the cue has
  //                 no assigned variant (the caller falls back to ReelAudio.sfx[kind]).
  function sfxPool(pools, opts) {
    const poolSeed = opts && opts.seed != null ? String(opts.seed) : "";
    const cache = {};

    function assign(cues) {
      const used = {};
      const last = {};
      // A pinned cue keeps the sound it was given and counts as the held variant in the rotation,
      // so replacing one hit does not change the sound of the cues after it.
      function pinCue(c) {
        const pin = c.pin;
        const own = pools[c.kind];
        if (own && own[pin.variant]) {
          c.variant = pin.variant;
          c.sound = variantId(c.kind, pin.variant, own[pin.variant]);
        }
        const heldKind = pin.holdsKind || c.kind;
        const held = pools[heldKind];
        if (!held || !held[pin.holds]) return;
        const id = variantId(heldKind, pin.holds, held[pin.holds]);
        used[id] = (used[id] || 0) + 1;
        last[heldKind] = [id, (last[heldKind] || [null])[0]];
      }
      cues
        .map((c, i) => ({ c, i }))
        .sort((a, b) => a.c.at - b.c.at || a.i - b.i)
        .forEach(({ c }) => {
          if (c.pin) return pinCue(c);
          const pool = pools[c.kind];
          if (!pool || !pool.length) return;
          const prev = last[c.kind] || [null, null];
          const best = pickVariant(c.kind, pool, used, prev);
          c.variant = best;
          c.sound = variantId(c.kind, best, pool[best]);
          used[c.sound] = (used[c.sound] || 0) + 1;
          last[c.kind] = [c.sound, prev[0]];
        });
      return cues;
    }

    function pickVariant(kind, pool, used, prev) {
      const n = pool.length;
      const start = hashStr(poolSeed + ":" + kind) % n;
      let best = -1;
      let bestScore = Infinity;
      pool.forEach((v, i) => {
        const id = variantId(kind, i, v);
        if (id === prev[0] && n > 1) return;
        const score = (used[id] || 0) * 10 + (id === prev[1] ? 5 : 0) + ((i - start + n) % n) * 0.01;
        if (score < bestScore) {
          bestScore = score;
          best = i;
        }
      });
      return best;
    }

    function buffer(cue, sampleRate, files) {
      const pool = pools[cue.kind];
      const v = pool && cue.variant >= 0 ? pool[cue.variant] : null;
      if (!v) return null;
      const key = cue.sound + "@" + sampleRate;
      if (!cache[key]) cache[key] = v.file ? fileBuffer(v, sampleRate, files) : synthBuffer(v, sampleRate, cue.sound);
      return cache[key];
    }

    // A synth variant without its own seed takes its id ("pop-2"), so variants of one kind differ.
    function synthBuffer(v, sampleRate, id) {
      const made = Float32Array.from(sfxKinds[v.gen](sampleRate, { seed: v.seed || id }));
      return resample(made, v.rate || 1);
    }

    function fileBuffer(v, sampleRate, files) {
      const f = files && files[v.file];
      if (!f) throw new Error("ReelAudio.sfxPool: no loaded file \"" + v.file + "\"");
      const raw = resample(f.data, f.rate / sampleRate);
      const ref = peakOf(sfxKinds[v.like](sampleRate, { seed: v.like + ":ref" }));
      return scaleBuf(raw, ref / (peakOf(raw) || 1));
    }

    return { assign, buffer };
  }

  // ---------------------------------------------------------------------
  // export
  // ---------------------------------------------------------------------

  const sfxKinds = {
    click: sfxClick,
    type: sfxType,
    thud: sfxThud,
    stamp: sfxThud,
    whoosh: sfxWhoosh,
    pop: sfxPop,
    tick: sfxTick,
    ding: sfxDing,
    pluck: sfxPluck,
  };

  globalThis.ReelAudio = {
    mix,
    master,
    duck,
    musicBed,
    applyAttackRamp,
    normalizePeak,
    setFilmKey,
    sfxPool,
    sfx: sfxKinds,
  };
})();

/* AUDIO:END */
</script>
<script>
/* SCENE:BEGIN */
(function () {
  "use strict";
  var WIDTH = 1080;
  var HEIGHT = 1920;
  var FPS = 30;
  var HAS_HANDWRITING = false;

  var canvas = document.getElementById("stage");

  var timings = null;
  var tl = null;
  var shots = [];
  var libManifest = null; // assets/lib/manifest.json, or null when absent

  // review.mjs --scan --layer captions. __reel.layers below declares that

  var dubCode = Reel.dubCode();
  var isCaptionLayer = layer === "captions";

  var HOLDS = []; // [{from, to, id?, reason?}] seconds the film holds or slows on purpose
  var CAPTION_FONTS = {}; // {"<lang>": "<css font-family list>", "*": "<fallback>"} the caption font per language
  var LANG_SPANS = []; // [{start, end, in?: "layer" | "scene"}] seconds that draw language-dependent text
  // Corner notes (a term gloss): plan line `notes: [{at: "start" | "word:<text>", text, corner?, holdSec?}]`,
  // drawn in the language's caption layer from that language's plan and word times.
  var cornerNoteList = [];

  // loading local JSON as part of building `ready`. `required` files

  // manifest/cues, design.md §2.5) resolve to null so a reel with no
  // assets/lib/ folder works exactly as before.

    return fetch(url).then(function (res) {

        return null;
      }
      return res.json();
    });
  }

  // The first of `urls` that exists; a base-language caption layer falls
  // back from dub/<base>/ to the film's own files (Reel.layerFiles).
  function loadFirstJSON(urls, required) {
    var i = 0;
    function next() {
      if (i >= urls.length) {
        if (required) throw new Error(urls.join(" or ") + " not found — run voice.mjs (or dub.mjs) first");
        return null;
      }
      return loadJSON(urls[i++], false).then(function (data) {
        return data == null ? next() : data;
      });
    }
    return Promise.resolve().then(next);
  }

  // meta.id -> ReelAudio.setFilmKey (reel-audio.js: gives this film's kit
  // sfx a character of their own — references/sound.md "Kit"). Optional: a
  // reel with no plan.json (should not happen) falls back to "film" rather
  // than failing ready.

    return loadJSON("plan.json", false).catch(function () {
      return null;
    }).then(function (plan) {

      var meta = (plan && plan.meta) || {};

  function buildNotes() {

  // voice/timings.json, which every non-caption layer — a label, a beat, an

  // clk.word, so it lands where it did in the original film. A render with no
  // dub has one clock and clk.base === tl.
  var baseTimings = null;
  var clk = null;

  function loadTimings() {
    return loadFirstJSON(files.timings, true).then(function (data) {
      timings = data;
      tl = Reel.timeline(timings);
      return isCaptionLayer && dubCode ? loadJSON("voice/timings.json", false) : null;
    }).then(function (base) {
      baseTimings = base || timings;
      clk = Reel.clocks(timings, baseTimings);

      // i+1's start (the last shot to the timeline duration), so shots
      // tile the whole film — including any gapMs silence between lines
      // — instead of leaving a blank, un-owned scene in each gap.
      // readAt stays the midpoint of the spoken line, not the shot span.
      var lines = timings.lines || [];
      shots = lines.map(function (l, i) {
        var start = i === 0 ? 0 : l.start;
        var end = i === lines.length - 1 ? timings.duration : lines[i + 1].start;
        return { id: l.id, start: start, end: end, readAt: (l.start + l.end) / 2 };
      });
      buildSfxCues();
    });
  }

  // dub/<code>/plan.json (plan.json for the base language) — that
  // language's per-line fields (e.g. an `emphasis` word list) and its
  // meta.overlay text for a film's own overlay code to key off, keeping pace
  // with the dub text rather than the base language's. Only loaded in
  // caption-layer mode.
  function loadDubPlan() {
    if (!isCaptionLayer) return Promise.resolve();
    return loadFirstJSON(files.plan, true).then(function (data) {
      dubPlan = data;
    });
  }

  // ---- asset library (design.md §2.5): manifest + cues, then preload
  // every video clip's frames so clipFrame(id, tLocal) is instant during
  // seek(t). Absent files (no assets/lib/) leave libManifest null and
  // libCues empty — nothing else here changes behavior in that case.
  function loadAssetLibrary() {
    return Promise.all([
      loadJSON("assets/lib/manifest.json", false),
      loadJSON("assets/lib/cues.json", false),
    ]).then(function (results) {
      libManifest = results[0];
      libCues = (results[1] && results[1].cues) || [];
      return preloadClipFrames();
    });
  }

  function frameFileName(index) {
    var s = String(index);
    while (s.length < 5) s = "0" + s;
    return "frame-" + s + ".jpg";
  }

  // Resolves once the image is decoded, not just loaded: `onload` alone
  // lets the first seek draw an image that is still decoding, so a cold
  // first frame differs from a warm one.
  function loadImage(src) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () {
        img.decode().then(
          function () { resolve(img); },
          function () { resolve(img); }
        );
      };
      img.onerror = function () {
        Reel.recordIssue({ type: "clip-frame-load-failed", src: src });
        resolve(null);
      };
      img.src = src;
    });

    if (!libManifest || !libManifest.assets) return Promise.resolve();
    var ids = Object.keys(libManifest.assets);
    return Promise.all(
      ids.map(function (id) {
        var meta = libManifest.assets[id];
        if (meta.kind !== "video") return null;
        var frameUrls = [];
        for (var i = 0; i < meta.frameCount; i++) {
          frameUrls.push(meta.frameDir + "/" + frameFileName(i));

        return Promise.all(frameUrls.map(loadImage)).then(function (frames) {

  // resolved `play` is "sound" or "both" (design.md §2.5). render.mjs reads
  // this through the page and mixes each `file` at its cue time itself —

    if (!libManifest || libCues.length === 0 || !timings) return [];
    var out = [];
    libCues.forEach(function (cue) {
      if (cue.play !== "sound" && cue.play !== "both") return;
      var line = null;
      for (var i = 0; i < timings.lines.length; i++) {
        if (timings.lines[i].id === cue.lineId) {
          line = timings.lines[i];
          break;

      var meta = libManifest.assets[cue.asset];
      if (!line || !meta) return;
      var file = meta.kind === "audio" ? meta.file : meta.audio;
      if (!file) return; // e.g. a silent video clip cued for sound

        file: file,
        at: Reel.cueTime(cue, line, timings),
        gainDb: cue.gainDb == null ? 0 : cue.gainDb,
        maxSec: cue.maxSec,
        // Sound-only files may start with silence; render.mjs skips it so the
        // sound lands on the cue. A clip's sound keeps its lead to stay on its picture.
        soundOnly: meta.kind === "audio",
      };
      SOUND_FADE_FIELDS.forEach(function (k) { if (cue[k] != null) item[k] = cue[k]; });

  // whose clip window [cueTime, cueTime+durationSec) contains t, on top of
  // the active scene. A pure function of t: which clip and which of its
  // frames follow only from the cued asset's own duration and cueTime.
  function drawLibCues(t) {
    if (!libManifest || libCues.length === 0 || !timings) return;
    libCues.forEach(function (cue) {
      if (cue.play !== "picture" && cue.play !== "both") return;
      var line = null;
      for (var i = 0; i < timings.lines.length; i++) {
        if (timings.lines[i].id === cue.lineId) {
          line = timings.lines[i];
          break;
        }

      if (!line || !meta || meta.kind !== "video") return;

  // SFX_CUES times should be derived from the measured timeline (tl.line /
  // tl.phrase), not hardcoded constants, so retiming a line moves its cue
  // with it. Cue shape: {at, kind, gain, pan, sync}.

  function buildSfxCues() {
    SFX_CUES = [];

  // exactly duration*sampleRate samples (mix()'s length contract). Builds a
  // ducked music-box bed plus the SFX_CUES onsets, then masters it.
  // Typed arrays, never plain Arrays: a 5-minute film as plain numbers ran
  // Node out of heap in render.mjs; Playwright passes typed arrays back as
  // they are.

    var duration = timings ? timings.duration : 0;
    var m = ReelAudio.mix(duration, sampleRate);
    var bed = ReelAudio.musicBed(duration, sampleRate, { bpm: 124, key: "A", gain: 0.16 });
    var narrationWindows = (timings && timings.lines ? timings.lines : []).map(function (l) {
      return { start: l.start, end: l.end };

      var gen = ReelAudio.sfx[cue.kind];

    // the resulting music ending up as loud as the voice after render.mjs's

    // -16 LUFS voice by default (references/sound.md "Mix"): about -28 LUFS

    // punchier signal than the bed alone and will not be pinned this quiet.
    ReelAudio.master(m, { peakDb: -15 });

  // scripts/sfx-cards.mjs's `measure` (references/sound.md "Sound cards").
  // Optional: a page that never calls this still works with everything
  // else; sfx-cards.mjs then falls back to measuring library cue files
  // directly and reports which cards it could not measure. `id` is the
  // cue's own `id` when SFX_CUES sets one (recommended, so it matches a
  // sound card's id exactly); otherwise "<kind>@<at>".
  // Only cues flagged `card: true` are rendered (all of them when none is
  // flagged), so a film with hundreds of cues does not hand hundreds of
  // stems to sfx-cards.mjs.
  function sfxStems(sampleRate) {
    var flagged = SFX_CUES.filter(function (cue) { return cue.card === true; });
    var out = (flagged.length ? flagged : SFX_CUES).map(function (cue) {

    ctx.translate(CX, lerp(820, 700, dim)); ctx.scale(s, s);
    ctx.globalAlpha *= lerp(1, 0.45, dim) * oc(prog(t, L.start, 0.35));
    panel(-420, -170, 840, 340, 30, PANEL, YEL, 4);
    text("지난주 10/10", 0, -115, 32, 700, GREY);
    spaced("TRIPLE-DOUBLE", 0, -50, 60, 900, YEL, 3);
    [["12", "점"], ["11", "리바"], ["10", "어시"]].forEach(function (v, i) {
      var x = -260 + i * 260;
      text(v[0], x, 40, 90, 900, WHITE);
      text(v[1], x, 110, 30, 700, GREY);
    });
    ctx.restore();
    var cu = prog(t, wt(L, "두"), 0.3);
    if (cu > 0 && dim < 0.5) pill("커리어 2번째", CX, 1030, 38, BG, YEL, null, oc(cu) * (1 - dim * 2), ob(cu));
    var u = prog(t, tr, 0.35);
    if (u > 0) {
      ctx.save(); ctx.globalAlpha *= oc(u);
      var sc = ob(u);
      ctx.translate(CX, 1080); ctx.scale(sc, sc);
      text("18", -60, 0, 230, 900, YEL);
      text("리바운드", 170, 50, 46, 900, WHITE);
      ctx.restore();
    }
  }
  function scCg7(t, L) {
    ctx.save(); ctx.globalAlpha *= 0.35;
    ctx.translate(CX, 700); ctx.scale(0.78, 0.78);
    text("18", -60, 0, 230, 900, YEL); text("리바운드", 170, 50, 46, 900, WHITE);
    ctx.restore();
    [["2", "득점", L.start + 0.05], ["2", "어시스트", L.start + 0.5]].forEach(function (v, i) {
      var u = prog(t, v[2], 0.35);
      if (u <= 0) return;
      var x = 330 + i * 420;
      var drop = (1 - oc(u)) * -160;
      var sag = Math.sin(prog(t, v[2] + 0.35, 1.2) * Math.PI) * 6;
      ctx.save(); ctx.globalAlpha *= oc(u);
      panel(x - 170, 900 + drop, 340, 300, 28, PANEL, null);
      text(v[0], x, 1020 + drop + sag, 160, 900, GREY);
      text(v[1], x, 1140 + drop, 36, 800, GREY);
      ctx.restore();
    });
  }
  function scOutro(t, L) {
    var tm = wt(L, "미라클모닝리그");
    var qOut = oc(prog(t, tm - 0.25, 0.3));
    if (qOut < 1) {
      ctx.save(); ctx.globalAlpha *= 1 - qOut;
      ctx.save(); enter(t, L.start - 0.1, 0.35);
      text("다음 주 주인공은?", CX, 700, 72, 900, WHITE);
      ctx.restore();
      ["락다운", "빅현욱", "챗지피지기"].forEach(function (n, i) {
        ctx.save(); enter(t, L.start + 0.15 + i * 0.12, 0.35);
        teamChip(n, CX, 880 + i * 120);
        ctx.restore();
      });
      ctx.restore();
    }
    if (qOut > 0) {
      ctx.save();
      ctx.globalAlpha *= qOut;
      ctx.strokeStyle = "rgba(255,255,255,0.08)"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(CX, 900, 330 + Math.sin(t * 1.2) * 4, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 900); ctx.lineTo(1080, 900); ctx.stroke();
      ctx.restore();
      var lu = prog(t, tm - 0.1, 0.5);
      drawLogo(CX, 820, lerp(1.35, 1.6, oc(lu)), oc(lu));
      spaced("ONBALL SCOUTING REPORT", CX, 990, 36, 900, YEL, 4, oc(prog(t, tm + 0.3, 0.4)));
      spaced("<MIRACLE REPORT>", CX, 1050, 28, 700, GREY, 6, oc(prog(t, tm + 0.45, 0.4)));
      text("미라클모닝리그 기록은 온볼에서", CX, 1160, 50, 900, WHITE, "center", oc(prog(t, wt(L, "기록은"), 0.4)));
    }
  }

  var SCENE_BY_ID = { hook: scHook, ld1: scLd1, ld2: scLd2, ld3: scLd3, ld4: scLd4, bh1: scBh1, bh2: scBh2, bh3: scBh3,
    cg1: scCg1, cg2: scCg2, cg3: scCg3, cg4: scCg4, cg5: scCg5, cg6: scCg6, cg7: scCg7, outro: scOutro };

  function currentLineIndex(t) {
    if (!timings) return -1;
    for (var i = 0; i < timings.lines.length; i++) {
      var l = timings.lines[i];
      if (t >= l.start && t < l.end) return i;
    }
    if (timings.lines.length && t >= timings.lines[timings.lines.length - 1].end) return timings.lines.length - 1;
    return -1;
  }
  function activeShotIndex(t) {
    if (!shots.length) return -1;
    for (var i = 0; i < shots.length; i++) if (t >= shots[i].start && t < shots[i].end) return i;
    return shots.length - 1;
  }

  // 자막 상자 투명도: 줄이 바뀔 때 0.12초 페이드, 엔딩 로고가 뜨면 사라짐
  function captionAlpha(t, line) {
    if (!line) return 0;
    if (line.id === "outro") {
      var tm = wt(line, "미라클모닝리그");
      return 1 - oc(prog(t, tm - 0.25, 0.3));
    }
    var idx = activeShotIndex(t), sh = shots[idx];
    return oc(prog(t, sh.start, 0.12));
  }
  function drawCaptions(t) {
    if (!Reel.captionsOn()) return;
    var line = captionLineAt(t);
    drawCaptionBox(line, captionAlpha(t, line));
  }
  function drawNotes(t, lang) {}

  function seek(t) {
    if (isCaptionLayer) {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);
      drawCaptions(t);
      return;
    }
    ctx.save();
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.restore();
    drawCourtBg(t);
    var idx = activeShotIndex(t);
    var line = idx >= 0 ? timings.lines[idx] : null;
    var outro = lineById("outro");
    var frameA = 1;
    if (outro) frameA = 1 - oc(prog(t, wt(outro, "미라클모닝리그") - 0.25, 0.3));
    if (frameA > 0) { drawHeader(frameA); drawFooter(frameA); }
    if (line && SCENE_BY_ID[line.id]) {
      ctx.save();
      // 장면마다 아주 느린 줌 — 멈춘 프레임이 없게
      var sh = shots[idx], zu = clamp((t - sh.start) / Math.max(0.5, sh.end - sh.start), 0, 1);
      var z = 1 + 0.045 * zu;
      ctx.translate(CX, 940); ctx.scale(z, z); ctx.translate(-CX, -940);
      SCENE_BY_ID[line.id](t, line, shots[idx]);
      ctx.restore();
    }
    drawCaptions(t);
  }

  // 효과음: 측정된 단어 시각에 붙는다(보이는 사건마다 하나)
  buildSfxCues = function () {
    SFX_CUES = [];
    if (!timings) return;
    function L(id) { return lineById(id); }
    function add(at, kind, gain, id) { SFX_CUES.push({ at: Math.max(0, at), kind: kind, gain: gain, id: id }); }
    var h = L("hook");
    if (h) { for (var k = 0; k < 3; k++) add(0.55 + k * 0.42, "tick", 0.5, "hook-w" + k); add(wt(h, "1월"), "pop", 0.7, "hook-badge"); }
    var l1 = L("ld1"); if (l1) { add(wt(l1, "꽁꽁"), "stamp", 0.8, "lock"); add(wt(l1, "스틸"), "whoosh", 0.4, "steals"); }
    var l2 = L("ld2"); if (l2) { add(wt(l2, "14"), "pop", 0.6, "ld2-14"); add(wt(l2, "팀") - 0.1, "whoosh", 0.35, "ld2-chart"); }
    var l3 = L("ld3"); if (l3) { add(wt(l3, "3점"), "whoosh", 0.35, "ld3-in"); add(wt(l3, "32점"), "ding", 0.55, "ld3-32"); }
    var l4 = L("ld4"); if (l4) add(wt(l4, "단독"), "stamp", 0.8, "ld4-stamp");
    var b1 = L("bh1"); if (b1) { add(wt(b1, "안팎"), "whoosh", 0.4, "bh1-in"); add(wt(b1, "29점"), "ding", 0.5, "bh1-29"); }
    var b2 = L("bh2"); if (b2) add(wt(b2, "커리어"), "stamp", 0.85, "career-high");
    var b3 = L("bh3"); if (b3) add(wt(b3, "배달"), "pop", 0.6, "bh3-first");
    var c1 = L("cg1"); if (c1) add(wt(c1, "23점"), "ding", 0.55, "cg1-23");
    var c2 = L("cg2"); if (c2) { add(wt(c2, "턴오버"), "thud", 0.7, "cg2-tov"); add(wt(c2, "팀") - 0.1, "whoosh", 0.35, "cg2-chart"); }
    var c3 = L("cg3"); if (c3) add(wt(c3, "더블더블"), "pop", 0.6, "cg3-dd");
    var c4 = L("cg4"); if (c4) add(wt(c4, "반년"), "pop", 0.55, "cg4-tag");
    var c5 = L("cg5"); if (c5) { add(wt(c5, "레이업"), "whoosh", 0.5, "cg5-layup"); add(wt(c5, "레이업") + 0.35, "stamp", 0.9, "winning-shot"); }
    var c6 = L("cg6"); if (c6) add(wt(c6, "리바운드"), "pop", 0.55, "cg6-18");
    var c7 = L("cg7"); if (c7) { add(c7.start + 0.05, "thud", 0.45, "cg7-a"); add(c7.start + 0.5, "thud", 0.45, "cg7-b"); }
    var o = L("outro"); if (o) add(wt(o, "미라클모닝리그") - 0.1, "ding", 0.6, "logo");
  };

  window.__reel = {
    get width() { return WIDTH; },
    get height() { return HEIGHT; },
    get fps() { return FPS; },
    get duration() { return timings ? timings.duration : 0; },
    ready: ready,
    seek: seek,
    get shots() { return shots; },
    get layers() { return ["captions"]; },
    get regions() { return Reel.checkRegions(REGIONS); },
    get holds() { return Reel.checkHolds(HOLDS); },
    get captionFonts() { return CAPTION_FONTS; },
    get langSpans() { return Reel.checkLangSpans(LANG_SPANS); },
    issues: function () { return Reel.issues(); },
    audio: { narration: "voice/narration.wav", renderSfx: renderSfx },
    sfxStems: sfxStems,
    soundCues: soundCues,
    get marks() {
      return SFX_CUES.map(function (c) {
        return { at: c.at, kind: c.kind, sync: !!c.sync };
      });
    },
  };
})();
/* SCENE:END */
</script>
</body>
